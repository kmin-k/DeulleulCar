<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>S3 주행 미니 카드</title><link rel="stylesheet" href="common.css">
<style>
  .map { flex: 1; border-radius: 28px; background:
      radial-gradient(circle at 30% 60%, rgba(61,220,151,.10), transparent 40%),
      repeating-linear-gradient(115deg, #141922 0 60px, #121720 60px 120px);
    position: relative; overflow: hidden; }
  .map .route { position: absolute; left: 6%; right: 30%; top: 62%; height: 10px; border-radius: 5px; background: var(--brand); transform: rotate(-8deg); opacity: .8; }
  .map .tag { position: absolute; left: 36px; bottom: 30px; font-size: 22px; color: var(--sub); }
  .mini { width: 640px; flex: none; justify-content: space-between; }
  .next .label { font-size: 26px; }
  .next .name { font-size: 52px; font-weight: 800; margin-top: 6px; letter-spacing: -0.03em; }
  .next .eta { font-size: 40px; color: var(--brand); font-weight: 800; margin-top: 8px; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chips .c { font-size: 26px; padding: 12px 20px; border-radius: 16px; background: var(--surface2); }
  .bottom { display: flex; align-items: center; gap: 24px; }
  .bottom .mic { width: 112px; height: 112px; }
</style></head>
<body><div class="screen">
  <div class="status">
    <span class="logo">들를<b>Car</b></span><span class="chip drive">주행 중</span>
    <span class="spacer"></span><span>18:47</span>
  </div>
  <div class="body">
    <div class="map"><div class="route"></div><div class="tag">Pleos 내비게이션 화면 영역</div></div>
    <section class="panel mini">
      <div class="next"><div class="label">다음 들를 곳 · 1/3</div><div class="name">행복약국</div><div class="eta">5분 · 1.2km</div></div>
      <div class="chips"><span class="c">남은 곳 2</span><span class="c"><span class="badge recommend">차의 할 일 1</span></span></div>
      <div class="bottom">
        <div class="mic"><svg viewBox="0 0 24 24" fill="#06210F"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg></div>
        <div class="muted" style="font-size:24px;line-height:1.4">주행 중에는 말로만 조작해요<br><span style="color:var(--text)">"하나 더 들러" · "다음에 할게"</span></div>
      </div>
    </section>
  </div>
</div></body></html>
